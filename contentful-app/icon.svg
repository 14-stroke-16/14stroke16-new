<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 14STROKE16 house style: ivory on black -->
  <rect width="512" height="512" rx="112" fill="#0B0B0B"/>

  <!-- Active field: solid ivory with a filled text line + caret -->
  <rect x="96" y="150" width="320" height="86" rx="18" fill="#F3EFE6"/>
  <rect x="124" y="182" width="176" height="22" rx="11" fill="#0B0B0B" opacity="0.82"/>
  <rect x="312" y="172" width="7" height="42" rx="3.5" fill="#0B0B0B" opacity="0.5"/>

  <!-- Disabled / greyed field: dashed outline, faint text -->
  <g opacity="0.4">
    <rect x="96" y="278" width="320" height="86" rx="18" fill="none" stroke="#F3EFE6" stroke-width="5" stroke-dasharray="16 13"/>
    <rect x="124" y="310" width="176" height="22" rx="11" fill="#F3EFE6" opacity="0.55"/>
  </g>
</svg>
